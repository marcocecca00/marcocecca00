name: Generate 3D contribution graph

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-commit

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Show token scopes
        env:
          T: ${{ secrets.PROFILE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          echo "PROFILE_PAT set: ${{ secrets.PROFILE_PAT != '' }}"
          curl -sI -H "Authorization: Bearer $T" https://api.github.com/user | grep -iE '^(HTTP|x-oauth-scopes|github-authentication-token-expiration)' || true
      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          # PROFILE_PAT (optional) lets the graph see languages of private repos
          GITHUB_TOKEN: ${{ secrets.PROFILE_PAT || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/profile-3d.json
      - name: Commit & push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A profile-3d-contrib
          if git commit -m "Update 3D contribution graph"; then
            git pull --rebase
            git push
          fi
